name: AI Code Review

on:
  workflow_call:
    inputs:
      ENZO_CODE_REVIEWER_APP_ID:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      ENZO_CODE_REVIEWER_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository being reviewed
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - name: Checkout code reviewer
        uses: actions/checkout@v4
        with:
          repository: solakpetri/Enzo.Helpers.CodeReviewer
          ref: main
          path: reviewer

      - name: Checkout AI skills
        uses: actions/checkout@v4
        with:
          repository: solakpetri/Enzo.Ai.Skills
          ref: main
          path: skills

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate PR diff
        working-directory: source
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > ../changes.diff

      - name: Create Enzo Code Reviewer GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.ENZO_CODE_REVIEWER_APP_ID }}
          private-key: ${{ secrets.ENZO_CODE_REVIEWER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Run code reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          dotnet reviewer/reviewer.cs changes.diff --skills skills
