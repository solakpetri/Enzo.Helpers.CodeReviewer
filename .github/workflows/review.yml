name: AI Code Review

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository being reviewed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Checkout AI skills
        uses: actions/checkout@v4
        with:
          repository: solakpetri/Enzo.Ai.Skills
          path: Enzo.Ai.Skills

      - name: Generate PR diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changes.diff

      - name: Run code reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          dotnet reviewer.cs changes.diff --skills Enzo.Ai.Skills
